<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#24483f">
  <meta name="description" content="A calm, private debt payoff companion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Lighter</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#home" data-route="home" aria-label="Lighter home">
      <span class="brand-mark" aria-hidden="true">L</span><span>Lighter</span>
    </a>
    <button class="icon-button" id="realityToggle" type="button" aria-pressed="false" title="Toggle Reality View">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span class="desktop-only">Reality View</span>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <section class="screen is-active" id="screen-home" data-screen="home" aria-labelledby="home-title"></section>
    <section class="screen" id="screen-debts" data-screen="debts" aria-labelledby="debts-title"></section>
    <section class="screen" id="screen-plan" data-screen="plan" aria-labelledby="plan-title"></section>
    <section class="screen" id="screen-whatif" data-screen="whatif" aria-labelledby="whatif-title"></section>
    <section class="screen" id="screen-journey" data-screen="journey" aria-labelledby="journey-title"></section>
    <section class="screen" id="screen-settings" data-screen="settings" aria-labelledby="settings-title"></section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#home" data-route="home"><span aria-hidden="true">⌂</span><small>Home</small></a>
    <a href="#debts" data-route="debts"><span aria-hidden="true">▤</span><small>Debts</small></a>
    <a href="#plan" data-route="plan"><span aria-hidden="true">◎</span><small>Plan</small></a>
    <a href="#whatif" data-route="whatif"><span aria-hidden="true">↗</span><small>What If?</small></a>
    <a href="#journey" data-route="journey"><span aria-hidden="true">◔</span><small>Journey</small></a>
    <a href="#settings" data-route="settings"><span aria-hidden="true">⚙</span><small>Settings</small></a>
  </nav>

  <dialog id="appDialog"><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
